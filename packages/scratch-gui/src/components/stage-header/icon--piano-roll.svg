<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
    <!-- Vertical piano keyboard: pitch runs bottom (low) to top (high), matching
         the piano roll's y-axis. Key dividers and black-key placement follow a
         real octave (no black key between E/F or B/C). -->
    <rect x="2" y="2" width="8" height="20" rx="1.5" fill="#fff" stroke="#575E75" stroke-width="1" />
    <line x1="2" y1="19.14" x2="10" y2="19.14" stroke="#575E75" stroke-width="0.6" />
    <line x1="2" y1="16.29" x2="10" y2="16.29" stroke="#575E75" stroke-width="0.6" />
    <line x1="2" y1="13.43" x2="10" y2="13.43" stroke="#575E75" stroke-width="0.6" />
    <line x1="2" y1="10.57" x2="10" y2="10.57" stroke="#575E75" stroke-width="0.6" />
    <line x1="2" y1="7.71" x2="10" y2="7.71" stroke="#575E75" stroke-width="0.6" />
    <line x1="2" y1="4.86" x2="10" y2="4.86" stroke="#575E75" stroke-width="0.6" />
    <rect x="2" y="18.04" width="5.3" height="2.2" fill="#575E75" />
    <rect x="2" y="15.19" width="5.3" height="2.2" fill="#575E75" />
    <rect x="2" y="9.47" width="5.3" height="2.2" fill="#575E75" />
    <rect x="2" y="6.61" width="5.3" height="2.2" fill="#575E75" />
    <rect x="2" y="3.76" width="5.3" height="2.2" fill="#575E75" />
    <!-- Note bars: a played-note snapshot of the piano roll grid to the right. -->
    <rect x="12" y="13.76" width="8" height="2.2" rx="1.1" fill="#855CD6" />
    <rect x="12" y="8.04" width="5" height="2.2" rx="1.1" fill="#855CD6" />
    <rect x="12" y="2.33" width="10" height="2.2" rx="1.1" fill="#855CD6" />
</svg>
